<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="llm-gateway-title">
  <title id="llm-gateway-title">llm-gateway</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="512" height="512" rx="110" fill="url(#sheen)"/>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- line with a cut for the node -->
    <g stroke-width="30">
      <path d="M60 256h90"/>
      <path d="M368 256C400 256 396 176 436 176h16"/>
      <path d="M368 256h84"/>
      <path d="M368 256C400 256 396 336 436 336h16"/>
    </g>
    <!-- chip node in the cut -->
    <g stroke-width="24">
      <path d="M220 184v-30"/>
      <path d="M256 184v-30"/>
      <path d="M292 184v-30"/>
      <path d="M220 328v30"/>
      <path d="M256 328v30"/>
      <path d="M292 328v30"/>
      <path d="M184 220h-30"/>
      <path d="M184 292h-30"/>
      <path d="M328 220h30"/>
      <path d="M328 292h30"/>
    </g>
    <rect stroke-width="30" x="184" y="184" width="144" height="144" rx="26"/>
    <!-- die -->
    <rect stroke-width="20" x="226" y="226" width="60" height="60" rx="10"/>
  </g>
</svg>
